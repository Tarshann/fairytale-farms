# Render Blueprint: one Node web service (API + static).
# Connect this repo in Render and add env vars (DATABASE_URL, STRIPE_*, etc.) in the dashboard.

services:
  - type: web
    name: fairytale-farms
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VITE_APP_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
